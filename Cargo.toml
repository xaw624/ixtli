[package]
name = "ixtli"
version = "0.2.0"
edition = "2021"
rust-version = "1.85"
resolver = "3"
description = "Usa tu celular Android como cámara web y micrófono en Linux"
license = "MIT"
repository = "https://github.com/xaw624/ixtli"
readme = "README.md"
keywords = ["webcam", "android", "scrcpy", "v4l2loopback", "linux"]
categories = ["multimedia::video"]

[dependencies]
# Interfaz. Se usa el renderizador por software (tiny-skia) para no depender
# de drivers de GPU: la ventana es pequeña y así funciona en cualquier equipo.
iced = { version = "0.13", default-features = false, features = ["tiny-skia", "tokio", "image"] }
# Dibuja los iconos SVG de los botones (misma versión que usa iced).
resvg = { version = "0.42", default-features = false }
# Dibuja el código QR para vincular el teléfono sin cable.
qrcode = { version = "0.14", default-features = false }
ctrlc = { version = "3", features = ["termination"] }
libc = "0.2"
# Imágenes de la vista previa sin copiarlas (la misma versión que usa iced).
bytes = "1"
# Busca el teléfono en la red local (mDNS): el adb de Debian viene sin esa búsqueda.
mdns-sd = { version = "0.21", default-features = false }

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
strip = true
