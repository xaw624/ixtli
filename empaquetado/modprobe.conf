# Ixtli: la cámara virtual aparece como «Ixtli» en /dev/video10. La segunda,
# «Ixtli-interna» en /dev/video11, es donde scrcpy escribe; Ixtli copia de ahí a
# «Ixtli» con un tamaño fijo, para que las videollamadas no la pierdan.
options v4l2loopback devices=2 video_nr=10,11 card_label=Ixtli,Ixtli-interna exclusive_caps=1,1
