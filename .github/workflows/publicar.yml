# Compila y prueba Ixtli en Debian 13, arma el .deb, lo instala en un Debian
# limpio y, al crear una etiqueta v*, lo publica en GitHub Releases.
name: Compilar y publicar

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  paquete:
    name: Compilar y empaquetar
    runs-on: ubuntu-latest
    # Debian 13 trae cargo 1.85, la versión con la que debe compilar Ixtli.
    container: debian:13
    steps:
      - name: Instalar herramientas
        run: |
          apt-get update
          apt-get install -y --no-install-recommends cargo gcc libc6-dev ca-certificates git dpkg-dev
      - uses: actions/checkout@v4
      - name: Pruebas
        run: cargo test --locked
      - name: Paquete .deb
        run: ./empaquetar.sh
      - name: Binario suelto
        run: tar -C target/release -czf target/deb/ixtli-linux-x86_64.tar.gz ixtli
      - uses: actions/upload-artifact@v4
        with:
          name: ixtli-linux
          path: |
            target/deb/*.deb
            target/deb/*.tar.gz
          if-no-files-found: error

  instalar:
    name: Instalar en un Debian limpio
    needs: paquete
    runs-on: ubuntu-latest
    container: debian:13
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ixtli-linux
      - name: Instalar el .deb
        run: |
          # scrcpy 3 está en trixie-backports (contrib).
          echo "deb http://deb.debian.org/debian trixie-backports main contrib" > /etc/apt/sources.list.d/backports.list
          apt-get update
          apt-get install -y ./ixtli_*.deb
      - name: Comprobar lo instalado
        run: |
          ixtli --version
          test -f /usr/share/applications/ixtli.desktop
          test -f /usr/lib/modules-load.d/ixtli.conf
          # Sin teléfono, «estado» termina con error; solo importa que corra.
          ixtli estado || true

  publicar:
    name: Publicar en Releases
    if: startsWith(github.ref, 'refs/tags/v')
    needs: instalar
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ixtli-linux
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            *.deb
            *.tar.gz
          generate_release_notes: true
